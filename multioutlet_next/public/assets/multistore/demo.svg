<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- BizPilot360X demo image: used wherever a photo has not been uploaded yet -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FF"/>
      <stop offset=".55" stop-color="#E4ECFB"/>
      <stop offset="1" stop-color="#EDE7FB"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".2" r=".55">
      <stop offset="0" stop-color="#C9DCFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C9DCFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".85" r=".5">
      <stop offset="0" stop-color="#DCCFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#DCCFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BF0"/>
      <stop offset="1" stop-color="#1E5FD0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3A8A" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <!-- soft background shapes -->
  <circle cx="230" cy="820" r="170" fill="#FFFFFF" opacity=".45"/>
  <circle cx="1390" cy="190" r="130" fill="#FFFFFF" opacity=".5"/>
  <rect x="1180" y="640" width="240" height="240" rx="56" fill="#FFFFFF" opacity=".35" transform="rotate(14 1300 760)"/>
  <rect x="160" y="120" width="180" height="180" rx="44" fill="#FFFFFF" opacity=".35" transform="rotate(-12 250 210)"/>
  <!-- centre card with the BizPilot360X mark (same shape as the favicon) -->
  <g filter="url(#sh)">
    <rect x="620" y="320" width="360" height="360" rx="96" fill="#FFFFFF"/>
  </g>
  <g transform="translate(680 380) scale(.4688)">
    <rect width="512" height="512" rx="112" fill="url(#mark)"/>
    <circle cx="256" cy="256" r="118" fill="none" stroke="#fff" stroke-width="56"/>
    <rect x="330" y="330" width="70" height="70" rx="18" fill="#7CC4FF"/>
  </g>
  <text x="800" y="745" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#6B7A99">DEMO IMAGE</text>
</svg>
